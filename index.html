<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanneman Family Calendar</title>

  <!-- FullCalendar 6 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <style>
    /* =========================================================
       EVERGREEN DREAMS PALETTE & CORE STYLES
       ========================================================= */
    :root {
      --bg-color: #0f172a;        /* Deep slate background */
      --card-bg: #1e293b;         /* Dark blue-gray card background */
      --text-main: #f8fafc;       /* Crisp white text */
      --text-muted: #94a3b8;      /* Muted gray text */
      --border-color: #334155;    /* Subtle border lines */
      
      /* Palette Accents */
      --sage-primary: #919682;   /* Main Sage Green accent */
      --sage-light: #C7CDBF;     /* Light Sage for headers/today */
      --sand-warm: #C7A491;      /* Warm Sand */
      --pink-soft: #EECFCA;      /* Soft Pink */
      --olive-dark: #595E48;     /* Dark Olive */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* =========================================================
       HEADER & LEGEND BAR
       ========================================================= */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 18px 32px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .title-group h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--sage-primary);
    }

    .clock-group {
      text-align: right;
    }

    .clock-time {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
    }

    .clock-date {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    .legend-bar {
      display: flex;
      gap: 24px;
      justify-content: center;
      background: var(--card-bg);
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }

    /* =========================================================
       CALENDAR CARD CONTAINER
       ========================================================= */
    #calendar-card {
      flex: 1;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.4);
    }

    /* =========================================================
       FULLCALENDAR OVERRIDES & TV OPTIMIZATIONS
       ========================================================= */
    .fc .fc-toolbar-title {
      font-size: 2.2rem !important;
      font-weight: 800;
      color: var(--text-main);
    }

    .fc .fc-button-primary {
      background-color: #334155 !important;
      border-color: #475569 !important;
      font-size: 1.1rem !important;
      font-weight: 700 !important;
      padding: 8px 16px !important;
      border-radius: 8px !important;
    }

    .fc .fc-button-active {
      background-color: var(--sage-primary) !important;
      border-color: var(--sage-primary) !important;
    }

    /* Day Headers (Sun, Mon, Tue...) */
    .fc-col-header-cell {
      background-color: var(--card-bg) !important;
    }

    .fc-col-header-cell-cushion {
      color: var(--sage-light) !important;
      font-size: 1.2rem !important;
      font-weight: 800 !important;
      text-decoration: none !important;
      padding: 10px 0 !important;
    }

    /* Grid Cells */
    .fc theme-standard td, 
    .fc theme-standard th {
      border-color: var(--border-color) !important;
    }

    .fc .fc-daygrid-day-number {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-muted);
      padding: 8px 12px !important;
    }

    .fc-daygrid-day-frame {
      min-height: 220px !important;
    }

    /* Highlight Today with Sage Accent */
    .fc .fc-day-today {
      background-color: rgba(145, 150, 130, 0.08) !important;
    }

    .fc .fc-day-today .fc-daygrid-day-number {
      color: var(--sage-primary) !important;
      background: rgba(145, 150, 130, 0.25);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Event Base Styles */
    .fc-event {
      border: none !important;
      border-radius: 8px !important;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>
<body>

  <!-- Dashboard Top Bar -->
  <header class="dashboard-header">
    <div class="title-group">
      <h1>Hanneman Family Dashboard</h1>
    </div>
    <div class="clock-group">
      <div id="live-time" class="clock-time">--:-- --</div>
      <div id="live-date" class="clock-date">Loading date...</div>
    </div>
  </header>

  <!-- Color-Coded Member Legend -->
  <div class="legend-bar">
    <div class="legend-item">
      <span class="legend-dot" style="background-color: #3b82f6;"></span> Kid Activities
    </div>
    <div class="legend-item">
      <span class="legend-dot" style="background-color: #d21f3c;"></span> Andrew Work
    </div>
    <div class="legend-item">
      <span class="legend-dot" style="background-color: #10b981;"></span> Family Events
    </div>
  </div>

  <!-- Calendar View Container -->
  <main id="calendar-card">
    <div id="calendar"></div>
  </main>

  <script>
    // 1. Live Clock & Date Function
    function updateClock() {
      const now = new Date();
      
      const timeString = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      document.getElementById('live-time').textContent = timeString;

      const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('live-date').textContent = now.toLocaleDateString([], dateOptions);
    }
    
    setInterval(updateClock, 1000);
    updateClock();

    // 2. FullCalendar Initialization
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      const calendar = new FullCalendar.Calendar(calendarEl, {
        views: {
          dayGridTwoWeeks: {
            type: 'dayGrid',
            duration: { weeks: 2 },
            buttonText: '2 Weeks'
          }
        },
        initialView: 'dayGridTwoWeeks',
        height: 'auto',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridTwoWeeks,dayGridMonth'
        },
        displayEventTime: true,
        eventTimeFormat: {
          hour: 'numeric',
          minute: '2-digit',
          meridiem: 'short'
        },
        events: './events.json?cachebust=' + new Date().getTime(),

        // Display Event Title and Notes/Description cleanly
        eventContent: function(arg) {
          let titleEl = document.createElement('div');
          titleEl.classList.add('fc-event-title');
          titleEl.innerText = arg.event.title;

          let arrayOfNodes = [titleEl];

          if (arg.event.extendedProps.description) {
            let descEl = document.createElement('div');
            descEl.style.fontSize = '0.85rem';
            descEl.style.fontWeight = '400';
            descEl.style.opacity = '0.9';
            descEl.style.marginTop = '2px';
            descEl.innerText = arg.event.extendedProps.description;
            arrayOfNodes.push(descEl);
          }

          return { domNodes: arrayOfNodes };
        }
      });

      calendar.render();

      // Auto-refresh every 5 minutes
      setInterval(() => {
        calendar.refetchEvents();
      }, 5 * 60 * 1000);
    });
  </script>
</body>
</html>
