<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanneman Family Calendar</title>

  <!-- FullCalendar 6 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

 <style>
    /* =========================================================
       EVERGREEN DREAMS PALETTE & CORE STYLES
       ========================================================= */
    :root {
      --bg-color: #0f172a;        /* Deep slate background */
      --card-bg: #1e293b;         /* Dark blue-gray card background */
      --text-main: #f8fafc;       /* Crisp white text */
      --text-muted: #94a3b8;      /* Muted gray text */
      --border-color: #334155;    /* Subtle border lines */
      
      /* Palette Accents */
      --sage-primary: #919682;   /* Main Sage Green accent */
      --sage-light: #C7CDBF;     /* Light Sage for headers/today */
      --sand-warm: #C7A491;      /* Warm Sand */
      --pink-soft: #EECFCA;      /* Soft Pink */
      --olive-dark: #595E48;     /* Dark Olive */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      max-height: 100vh;
      width: 100vw;
      overflow: hidden; /* Prevents whole-page scrolling on TV */
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* =========================================================
       HEADER & LEGEND BAR (Compact for TV)
       ========================================================= */
   .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      gap: 12px;
    }

    .title-group h1 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--sage-primary);
      white-space: nowrap;
    }

    /* Embedded Legend Bar */
    .legend-bar {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .clock-group {
      text-align: right;
    }

    .clock-time {
      font-size: 1.4rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
    }

    .clock-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 500;
    }
    /* =========================================================
       CALENDAR CONTAINER (Flex Stretch)
       ========================================================= */
    #calendar-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--card-bg);
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      min-height: 0; /* Important for flex child scaling */
      overflow: hidden;
    }

    #calendar {
      height: 100%;
      width: 100%;
    }

    /* =========================================================
       FULLCALENDAR TV OVERRIDES
       ========================================================= */
    .fc .fc-toolbar {
      margin-bottom: 8px !important;
    }

    .fc .fc-toolbar-title {
      font-size: 1.5rem !important;
      font-weight: 800;
      color: var(--text-main);
    }

    .fc .fc-button-primary {
      background-color: #334155 !important;
      border-color: #475569 !important;
      font-size: 0.9rem !important;
      font-weight: 700 !important;
      padding: 4px 10px !important;
      border-radius: 6px !important;
    }

    .fc .fc-button-active {
      background-color: var(--sage-primary) !important;
      border-color: var(--sage-primary) !important;
    }

    /* Day Headers */
    .fc-col-header-cell {
      background-color: var(--card-bg) !important;
    }

    .fc-col-header-cell-cushion {
      color: var(--sage-light) !important;
      font-size: 1rem !important;
      font-weight: 800 !important;
      text-decoration: none !important;
      padding: 4px 0 !important;
    }

    /* Remove hardcoded height on frames so rows auto-fit the screen */
    .fc-daygrid-day-frame {
      min-height: 0 !important;
      height: 100% !important;
    }

    .fc .fc-daygrid-day-number {
      font-size: 1rem;
      font-weight: 800;
      color: var(--text-muted);
      padding: 2px 6px !important;
    }

    /* Highlight Today */
    .fc .fc-day-today {
      background-color: rgba(145, 150, 130, 0.1) !important;
    }

    .fc .fc-day-today .fc-daygrid-day-number {
      color: var(--sage-primary) !important;
      background: rgba(145, 150, 130, 0.25);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .fc-event {
      border: none !important;
      border-radius: 4px !important;
    }
  </style>
</head>
<body>
  
  <header class="dashboard-header">
    <div class="title-group">
      <h1>Hanneman Family Dashboard</h1>
    </div>

    <!-- Embedded Legend Bar -->
    <div class="legend-bar">
      <div class="legend-item">
        <span class="legend-dot" style="background-color: #3b82f6;"></span> Kid Activities
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background-color: #d21f3c;"></span> Andrew Work
      </div>
      <div class="legend-item">
        <span class="legend-dot" style="background-color: #10b981;"></span> Family Events
      </div>
    </div>

    <div class="clock-group">
      <div id="live-time" class="clock-time">--:-- --</div>
      <div id="live-date" class="clock-date">Loading date...</div>
    </div>
  </header>

  <!-- Calendar View Container -->
  <main id="calendar-card">
    <div id="calendar"></div>
  </main>

  <script>
    // 1. Live Clock & Date Function
    function updateClock() {
      const now = new Date();
      
      const timeString = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      document.getElementById('live-time').textContent = timeString;

      const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('live-date').textContent = now.toLocaleDateString([], dateOptions);
    }
    
    setInterval(updateClock, 1000);
    updateClock();

    // 2. FullCalendar Initialization
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      const calendar = new FullCalendar.Calendar(calendarEl, {
        views: {
          dayGridTwoWeeks: {
            type: 'dayGrid',
            duration: { weeks: 2 },
            buttonText: '2 Weeks'
          }
        },
        initialView: 'dayGridMonth',
        height: '100%', 
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridTwoWeeks,dayGridMonth'
        },
        displayEventTime: true,
        eventTimeFormat: {
          hour: 'numeric',
          minute: '2-digit',
          meridiem: 'short'
        },
        events: './events.json?cachebust=' + new Date().getTime(),

        // Render Title + Notes with correct background color
        eventContent: function(arg) {
          let container = document.createElement('div');
          container.style.backgroundColor = arg.event.backgroundColor || '#919682';
          container.style.borderColor = arg.event.borderColor || '#919682';
          container.style.color = '#ffffff';
          container.style.padding = '6px 8px';
          container.style.borderRadius = '6px';
          container.style.width = '100%';
          container.style.boxSizing = 'border-box';

          let titleEl = document.createElement('div');
          titleEl.style.fontWeight = '700';
          titleEl.style.fontSize = '0.95rem';
          titleEl.style.lineHeight = '1.2';
          titleEl.innerText = arg.event.title;
          container.appendChild(titleEl);

          if (arg.event.extendedProps && arg.event.extendedProps.description) {
            let descEl = document.createElement('div');
            descEl.style.fontSize = '0.8rem';
            descEl.style.fontWeight = '400';
            descEl.style.opacity = '0.9';
            descEl.style.marginTop = '4px';
            descEl.innerText = arg.event.extendedProps.description;
            container.appendChild(descEl);
          }

          return { domNodes: [container] };
        }
      });

      calendar.render();

      // Auto-refresh every 5 minutes
      setInterval(() => {
        calendar.refetchEvents();
      }, 5 * 60 * 1000);
    });
  </script>
</body>
</html>
