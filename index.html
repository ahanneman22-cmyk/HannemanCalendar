<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Calendar</title>

  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background-color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }

    #calendar-card {
      max-width: 1200px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
    }

    /* Color Legend Bar */
    .legend-bar {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: #334155;
      font-size: 0.95rem;
    }

    .legend-color {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Event Card Styles */
    .fc-event {
      border-radius: 6px;
      font-weight: 600;
      padding: 2px 6px;
      border: none;
      color: #ffffff !important;
    }

    .fc-toolbar-title {
      font-size: 1.8rem !important;
      color: #0f172a;
    }
  </style>
</head>
<body>

  <div id="calendar-card">
    <!-- Visual Color Legend -->
    <div class="legend-bar">
      <div class="legend-item">
        <span class="legend-color" style="background-color: #3b82f6;"></span> Kid Activities
      </div>
      <div class="legend-item">
        <span class="legend-color" style="background-color: #D21F3c;"></span> Andrew's Work
      </div>
      <div class="legend-item">
        <span class="legend-color" style="background-color: #10b981;"></span> Family
      </div>
    </div>

    <!-- Calendar View -->
    <div id="calendar"></div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: ''
        },
        // Pulls all merged events directly from events.json
        events: './events.json'
      });

      calendar.render();
    });
  </script>
</body>
</html>
