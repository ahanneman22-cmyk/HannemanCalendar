<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hanneman Family Calendar</title>

  <!-- FullCalendar 6 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;       /* Deep slate background (easy on TV screens) */
      --card-bg: #1e293b;        /* Dark blue-gray card background */
      --text-main: #f8fafc;      /* Crisp white text */
      --text-muted: #94a3b8;     /* Muted gray text */
      --border-color: #334155;   /* Subtle border lines */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Top Dashboard Header */
    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 18px 32px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .title-group h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #38bdf8; /* Vibrant sky blue */
    }

    /* Live Digital Clock */
    .clock-group {
      text-align: right;
    }

    .clock-time {
      font-size: 2.2rem;
      font-weight: 800;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .clock-date {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 4px;
      font-weight: 500;
    }

    /* Family Member Legend Bar */
    .legend-bar {
      display: flex;
      gap: 24px;
      justify-content: center;
      background: var(--card-bg);
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .legend-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
    }

    /* Calendar Container */
    #calendar-card {
      flex: 1;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 30px -10px rgba(0, 0, 0, 0.4);
    }

    /* --- FullCalendar TV Optimizations --- */
    
    /* Header Toolbar Controls */
    .fc .fc-toolbar-title {
      font-size: 2.2rem !important;
      font-weight: 800;
      color: var(--text-main);
    }

    .fc .fc-button-primary {
      background-color: #334155 !important;
      border-color: #475569 !important;
      font-size: 1.1rem !important;
      font-weight: 700 !important;
      padding: 8px 16px !important;
      border-radius: 8px !important;
    }

    .fc .fc-button-active {
      background-color: #0284c7 !important;
      border-color: #0284c7 !important;
    }

    /* Grid & Cell Styling */
    .fc theme-standard td, .fc theme-standard th {
      border-color: var(--border-color) !important;
    }

    .fc .fc-col-header-cell-cushion {
      font-size: 1.2rem;
      font-weight: 700;
      color: #919682;
      padding: 10px 0 !important;
    }

    .fc .fc-daygrid-day-number {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--text-muted);
      padding: 8px 12px !important;
    }

    /* Highlight Today */
    .fc .fc-day-today {
      background-color: rgba(56, 189, 248, 0.08) !important;
    }

    .fc .fc-day-today .fc-daygrid-day-number {
      color: #38bdf8 !important;
      background: rgba(56, 189, 248, 0.2);
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Event Badges (Kid-friendly & Bold) */
    .fc-event {
      border-radius: 8px !important;
      font-size: 1rem !important;
      font-weight: 700 !important;
      padding: 4px 8px !important;
      margin-top: 3px !important;
      border: none !important;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .fc-event-title {
      color: #ffffff !important;
    }
      /* Allow event titles to wrap onto multiple lines for TV reading */
    .fc-event-title {
      white-space: normal !important;
      overflow: visible !important;
      word-break: break-word;
    }

    .fc-daygrid-event {
      white-space: normal !important;
      align-items: flex-start !important;
    }

    /* Expand day cell minimum height to fill the TV screen comfortably */
    .fc-daygrid-day-frame {
      min-height: 220px !important;
    }
    }
  </style>
</head>
<body>

  <!-- Dashboard Top Bar -->
  <header class="dashboard-header">
    <div class="title-group">
      <h1>Hanneman Family Dashboard</h1>
    </div>
    <div class="clock-group">
      <div id="live-time" class="clock-time">--:-- --</div>
      <div id="live-date" class="clock-date">Loading date...</div>
    </div>
  </header>

  <!-- Color-Coded Member Legend -->
  <div class="legend-bar">
    <div class="legend-item">
      <span class="legend-dot" style="background-color: #3b82f6;"></span> Kid Activities
    </div>
    <div class="legend-item">
      <span class="legend-dot" style="background-color: #d21f3c;"></span> Andrew Work
    </div>
    <div class="legend-item">
      <span class="legend-dot" style="background-color: #10b981;"></span> Family Events
    </div>
  </div>

  <!-- Calendar View Container -->
  <main id="calendar-card">
    <div id="calendar"></div>
  </main>

  <script>
    // 1. Live Clock & Date Function
    function updateClock() {
      const now = new Date();
      
      // Formatting Time (e.g., 8:15 AM)
      const timeString = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      document.getElementById('live-time').textContent = timeString;

      // Formatting Date (e.g., Friday, October 24)
      const dateOptions = { weekday: 'long', month: 'long', day: 'numeric' };
      document.getElementById('live-date').textContent = now.toLocaleDateString([], dateOptions);
    }
    
    setInterval(updateClock, 1000);
    updateClock();

    // 2. FullCalendar Initialization
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      const calendar = new FullCalendar.Calendar(calendarEl, {
        // Define a custom 2-week view
        views: {
          dayGridTwoWeeks: {
            type: 'dayGrid',
            duration: { weeks: 2 },
            buttonText: '2 Weeks'
          }
        },
        initialView: 'dayGridTwoWeeks', // Default to 2-week view
        height: 'auto',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridTwoWeeks,dayGridMonth'
        },
        
        // Show start times on events
        displayEventTime: true,
        eventTimeFormat: {
          hour: 'numeric',
          minute: '2-digit',
          meridiem: 'short'
        },

        // Fetch events from local events.json generated by GitHub Action
        events: './events.json?cachebust=' + new Date().getTime()
      });
      calendar.render();

      // 3. Auto-refreshes event data every 5 minutes without reloading the page
      setInterval(() => {
        calendar.refetchEvents();
      }, 5 * 60 * 1000);
    });
  </script>
</body>
</html>
  </script>
</body>
</html>
